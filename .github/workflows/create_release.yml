name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - name: Download stable Dalamud
        shell: pwsh
        run: |
          $dalamud = Join-Path $env:RUNNER_TEMP 'dalamud'
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile "$env:RUNNER_TEMP/dalamud.zip"
          Expand-Archive "$env:RUNNER_TEMP/dalamud.zip" $dalamud
          "DALAMUD_HOME=$dalamud" >> $env:GITHUB_ENV
      - name: Restore locked packages
        run: dotnet restore Dagobert.sln --locked-mode
      - name: Check scheduling behavior
        run: dotnet run --project Dagobert.Checks -c Release
      - name: Build plugin
        run: dotnet build Dagobert/Dagobert.csproj --no-restore -c Release -p:Platform=x64
      - uses: actions/upload-artifact@v4
        with:
          name: Dagobert
          path: Dagobert/bin/x64/Release/Dagobert/*
          if-no-files-found: error
      - name: Update Dalamud installation repository
        shell: pwsh
        run: |
          git fetch origin master
          git checkout -B repository-update origin/master
          python scripts/update_plugin_repository.py --package-dir Dagobert/bin/x64/Release/Dagobert
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pluginmaster.json plugins/Dagobert
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "Update Dalamud plugin repository package"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:master
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Create test release in this repository
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" "Dagobert/bin/x64/Release/Dagobert/latest.zip" --verify-tag --prerelease --title "Dagobert $env:GITHUB_REF_NAME" --notes-file .github/release-notes.md
